description: "Validation error"
content:
  application/json:
    schema:
      type: object
      properties:
        message:
          type: string
          description: "Errors overview"
        errors:
          type: object
          description: "A detailed description of each field that failed validation"
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - message
        - errors
    examples:
      default:
        $ref: "examples/ValidationException_Example.yaml"
