type: object
properties:
  id:
    type: 'integer'
  name:
    type: 'string'
  email:
    type: 'string'
  email_verified_at:
    oneOf:
      - type: 'string'
        format: date-time
      - type: 'null'
  photo_id:
    oneOf:
      - type: 'integer'
      - type: 'null'
  created_at:
    oneOf:
      - type: 'string'
        format: date-time
      - type: 'null'
  updated_at:
    oneOf:
      - type: 'string'
        format: date-time
      - type: 'null'
  deleted_at:
    oneOf:
      - type: 'string'
        format: date-time
      - type: 'null'
  roles:
    type: array
    items:
      $ref: "./RoleResource.yaml"
  books:
    type: array
    items:
      $ref: "./BookResource.yaml"
  phone:
    type: array
    items:
      $ref: "./PhoneResource.yaml"
  photo:
    type: array
    items:
      $ref: "./PhotoResource.yaml"
required:
  - id
  - name
  - email
  - email_verified_at
  - photo_id
  - created_at
  - updated_at
  - deleted_at
title: UserResource
