type: object
properties:
  id:
    type: string
  type:
    type: string
    enum:
      - search_results
  attributes:
    type: object
    properties:
      books:
        type: array
        items:
          $ref: ./BookResource.yaml
      authors:
        type: array
        items:
          $ref: ./AuthorResource.yaml
      total:
        type: integer
    required:
      - books
      - authors
      - total
  relationships:
    type: object
    additionalProperties:
      type: object
required:
  - id
  - type
  - attributes
title: SearchResultResource
