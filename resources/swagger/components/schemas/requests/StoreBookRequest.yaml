type: object
properties:
  name:
    type: string
    maxLength: 100
  author_id:
    oneOf:
      - type: integer
      - type: 'null'
  author_id1:
    oneOf:
      - type: integer
      - type: 'null'
  author_id2:
    oneOf:
      - type: integer
      - type: 'null'
  authorLastname:
    oneOf:
      - type: string
        maxLength: 100
      - type: 'null'
  authorFirstname:
    oneOf:
      - type: string
        maxLength: 100
      - type: 'null'
  authorPatronymic:
    oneOf:
      - type: string
        maxLength: 100
      - type: 'null'
  authorBirthdate:
    oneOf:
      - type: string
        format: date
        description: "Must be at least 14 years ago"
      - type: 'null'
  page_count:
    type: integer
    minimum: 1
  condition:
    type: string
    enum:
      - perfect
      - good
      - normal
      - bad
      - terrible
  cover:
    oneOf:
      - type: string
        format: binary
        description: "jpeg or png file, max 2MB"
      - type: 'null'
  publishing_house:
    oneOf:
      - type: string
      - type: 'null'
  publication_year:
    oneOf:
      - type: string
        pattern: '^\d{4}$'
      - type: 'null'
  book_type_id:
    type: integer
  isbn:
    oneOf:
      - type: string
        minLength: 13
        maxLength: 13
      - type: 'null'
required:
  - name
  - page_count
  - book_type_id

anyOf:
  - required: [author_id]
  - required: [authorLastname, authorFirstname]

title: StoreBookRequest
