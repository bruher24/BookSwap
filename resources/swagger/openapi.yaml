      responses:
        "200":
          $ref: "components/responses/api/Success_Response.yaml"
        "400":
          $ref: "components/responses/exceptions/BadRequest.yaml"
        "401":
          $ref: "components/responses/exceptions/AuthenticationException.yaml"
        "403":
          $ref: "components/responses/exceptions/Forbidden.yaml"

  /auth/verify_email/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
      - name: expires
        in: query
        required: true
        schema:
          type: integer
      - name: signature
        in: query
        required: true
        schema:
          type: string
    get:
      operationId: auth.verifyEmail
      tags:
        - Auth
      security: [ ]
      responses:
        "302":
          description: "Redirects to frontend success or failure page"
        "400":
          $ref: "components/responses/exceptions/BadRequest.yaml"

