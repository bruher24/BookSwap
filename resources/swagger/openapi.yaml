          $ref: "components/responses/api/Refresh_Response.yaml"
        400:
          $ref: "components/responses/exceptions/BadRequest.yaml"
        401:
          $ref: "components/responses/exceptions/AuthenticationException.yaml"
        403:
          $ref: "components/responses/exceptions/Forbidden.yaml"

  /auth/logout:
    post:
      operationId: auth.logout
      tags:
        - Auth
      requestBody:
        $ref: "components/requestBodies/RefreshRequest_Body.yaml"
      responses:
        200:
          description: "OK"
        400:
          $ref: "components/responses/exceptions/BadRequest.yaml"
        401:
          $ref: "components/responses/exceptions/AuthenticationException.yaml"
        403:
          $ref: "components/responses/exceptions/Forbidden.yaml"

