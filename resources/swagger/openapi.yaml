openapi: 3.1.0
info:
  title: BookSwap
  version: 0.0.1
servers:
  - url: http://localhost/api/v1
# TODO: Во многих контроллерах backend сейчас возвращает HTTP 200 с FailureResource/SuccessResource,
# где в payload есть поле `statusCode`, вместо реальных HTTP-кодов контракта (401/404/202 и др.).
# Предлагаемое исправление backend: возвращать фактические HTTP-коды по контракту OpenAPI
# и сохранить `statusCode` в теле только как дублирующее поле (или убрать его в v2).
# TODO: Для части PUT endpoints backend пока возвращает пустой SuccessResource, тогда как контракт
# требует вернуть обновлённый ресурс в `data`.
# Предлагаемое исправление backend: после update возвращать актуальный ресурс по контракту.
paths:
  /auth/register:
    post:
      operationId: auth.register
      tags:
        - Auth
      requestBody:
        $ref: "components/requestBodies/StoreUserRequest_Body.yaml"
      responses:
        200:
          $ref: "components/responses/api/Login_Response.yaml"
        400:
          $ref: "components/responses/exceptions/BadRequest.yaml"
        422:
          $ref: "components/responses/exceptions/ValidationException.yaml"

  /auth/login:
    post:
      operationId: auth.login
      tags:
        - Auth
      requestBody:
        $ref: "components/requestBodies/AuthRequest_Body.yaml"
      responses:
        200:
          $ref: "components/responses/api/Login_Response.yaml"
        400:
          $ref: "components/responses/exceptions/BadRequest.yaml"
        401:
          $ref: "components/responses/exceptions/AuthenticationException.yaml"
      # TODO: AuthController::login() при неверных учетных данных сейчас возвращает FailureResource (HTTP 200, statusCode 400),
      # а не контрактный 401.
      # Предлагаемое исправление backend: отдавать HTTP 401 для auth-failure.

  /auth/refresh:
    post:
      operationId: auth.refresh
      tags:
        - Auth
      requestBody:
        $ref: "components/requestBodies/RefreshRequest_Body.yaml"
      responses:
