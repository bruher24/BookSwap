        401:
          $ref: "./components/responses/AuthenticationException.yaml"
        422:
          $ref: "./components/responses/ValidationException.yaml"

  /auth/refresh:
    post:
      operationId: auth.refresh
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        200:
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                required:
                  - token
        400:
          $ref: "./components/responses/BadRequest.yaml"
        401:
          $ref: "./components/responses/AuthenticationException.yaml"
        404:
          description: "Bad request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  errors:
                    type: array
                    prefixItems:
                      type: string
                      enum: Ошибка обновления токена
                    minItems: 1
                    maxItems: 1
                required:
                  - success
                  - errors

