      security: [ ]
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: publishing_house[]
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: publication_year[]
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: '^\d{4}$'
        - name: page_count[]
          in: query
          required: false
          schema:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: integer
        - name: book_type_id[]
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: author_id[]
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
        - name: genre_id[]
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
