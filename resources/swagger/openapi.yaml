openapi: 3.1.0
info:
  title: BookSwap
  version: 0.0.1
servers:
  - url: http://localhost/api/v1
paths:
  /auth/register:
    post:
      operationId: auth.register
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components/schemas/Requests/StoreUserRequest.yaml"
            examples:
              default:
                $ref: "./components/examples/StoreUserRequestExample.yaml"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "./components/schemas/Resources/UserResource.yaml"
                  token:
                    type: string
                required:
                  - user
                  - token
              examples:
                success:
                  $ref: "./components/examples/UserResourceExample.yaml"
        400:
          $ref: "./components/responses/BadRequest.yaml"
        422:
          $ref: "./components/responses/ValidationException.yaml"

  /auth/login:
    post:
      operationId: auth.login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components/schemas/Requests/AuthRequest.yaml"
            examples:
              default:
                $ref: "./components/examples/AuthRequestExample.yaml"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "./components/schemas/Resources/UserResource.yaml"
