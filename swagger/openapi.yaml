  /auth/register:
    post:
      operationId: auth.register
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreUserRequest"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserResource"
                  token:
                    type: string
                required:
                  - user
                  - token
        400:
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    minItems: 1
                    maxItems: 3
                required:
                  - errors
        422:
          $ref: "#/components/responses/ValidationException"

  /auth/login:
    post:
