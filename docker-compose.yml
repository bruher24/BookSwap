services:
    nginx:
        build:
            context: .
            dockerfile: docker/nginx/Dockerfile
        container_name: app-nginx
        restart: always
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
            - ./docker/nginx/certs:/etc/nginx/certs
            - ./:/var/www/
        depends_on:
            - app
        networks:
            - app-network

    app:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: app
        restart: always
        #        user: 33:33
        ports:
            - "5173:5173"
            - "3030:3030"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ./:/var/www/
        depends_on:
            - postgres
        networks:
            - app-network
            - cache-proxy
            - mailhog-proxy
            - typesense-proxy

    psalm:
        image: ghcr.io/danog/psalm:latest
        container_name: app-psalm
        volumes:
            - .:/app
        working_dir: /app
        networks:
            - app-network

    postgres:
        image: postgres:latest
        container_name: app-postgres
        restart: always
        user: "postgres"
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            PGDATA: /var/lib/postgresql/data/pgdata
        ports:
            - "5433:${DB_PORT}"
        healthcheck:
            test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}'" ]
            interval: 10s
            timeout: 3s
            retries: 3
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - app-network

    adminer:
        image: adminer:latest
        container_name: app-adminer
        restart: always
        environment:
            ADMINER_DEFAULT_DB_DRIVER: ${DB_CONNECTION}
            ADMINER_DEFAULT_DB_HOST: ${DB_HOST}:${DB_PORT}
            ADMINER_DEFAULT_DB_NAME: ${DB_DATABASE}
            ADMINER_DESIGN: nette
            ADMINER_DEFAULT_SERVER: ${DB_HOST}:${DB_PORT}
        ports:
            - "8080:8080"
        depends_on:
            - postgres
        networks:
            - app-network

    rabbitmq:
        image: rabbitmq:4-management
        container_name: app-rabbitmq
        restart: always
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            - RABBITMQ_DEFAULT_VHOST=local
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
        volumes:
            - rabbitmq_data:/data
        networks:
            - app-network

