services:
    nginx:
        image: nginx:alpine
        container_name: app-nginx
        restart: unless-stopped
        ports:
            - "3000:80"
        volumes:
            - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
            - ./:/var/www/
        depends_on:
            -   app
        networks:
            - app-network

    app:
        build:
            context: .
            dockerfile: docker/app/Dockerfile
        container_name: app
        ports:
            - "5173:5173"
        volumes:
            - ./:/var/www/
        depends_on:
            -   postgres
        networks:
            - app-network

    postgres:
        image: postgres:latest
        container_name: app-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            PGDATA: /var/lib/postgresql/data/pgdata
        ports:
            - "5433:${DB_PORT}"
        volumes:
            - ./pgdata:/var/lib/postgresql/data/pgdata
        networks:
            - app-network

    redis:
        image: redis:latest
        container_name: app-redis
        restart: always
        command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
        volumes:
            - ./redis:/data
        ports:
            - "6379:${REDIS_PORT}"
        networks:
            - app-network

    adminer:
        image: adminer:latest
        container_name: app-adminer
        restart: always
        ports:
            - "8080:8080"
        environment:
            ADMINER_DEFAULT_DB_DRIVER: ${DB_CONNECTION}
            ADMINER_DEFAULT_DB_HOST: ${DB_HOST}:${DB_PORT}
            ADMINER_DEFAULT_DB_NAME: ${DB_DATABASE}
            ADMINER_DESIGN: nette
            ADMINER_DEFAULT_SERVER: ${DB_HOST}:${DB_PORT}
        depends_on:
            -   postgres
        networks:
            - app-network

    typesense:
        image: typesense/typesense:29.0
        container_name: app-typesense
        restart: always
        ports:
            - "8108:${TYPESENSE_PORT}"
        volumes:
            - ./typesense-data:/data
        command: '--data-dir /data --api-key=xyz --enable-cors'
        networks:
            - app-network

    dashboard:
        image: ghcr.io/lewynation/typesense-admin-dashboard:latest
        container_name: app-dashboard
        restart: always
        ports:
            - "3005:3000"
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    pgdata:
        driver: local
    typesense-data:
        driver: local
